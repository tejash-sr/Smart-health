# Pulse Engage — production analyzer config
#
# Built on top of the official Flutter lints. We enable a focused set of
# additional rules that catch real production bugs (resource leaks, accidental
# `print`, missing async error handling, etc.) without being noisy.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # strict-casts catches implicit dynamic casts — the highest-value of the
    # three strict modes for catching production bugs.
    strict-casts: true
  errors:
    # Treat any leftover TODO as info (do not break build).
    todo: ignore
    # Critical for production safety
    invalid_assignment: error
    missing_required_param: error
    missing_return: error
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "ios/Pods/**"

linter:
  rules:
    # Style consistency (already aligned with the codebase)
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true

    # Production safety (the high-value catches)
    avoid_print: true
    avoid_returning_null_for_future: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    no_logic_in_create_state: true
    throw_in_finally: true
    use_build_context_synchronously: true

    # Code clarity
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_unused_constructor_parameters: true
