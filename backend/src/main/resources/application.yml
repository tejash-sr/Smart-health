# =====================================================================
# Pulse Engage backend — default (dev) configuration
#
# Every host-specific value is sourced from an environment variable
# (PULSE_*) with a safe local default that matches docker-compose.yml
# so `docker compose up -d --build` is the only command needed for
# a clean local boot.
# =====================================================================

server:
  port: ${PULSE_SERVER_PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: pulse-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5432/pulse_db}
    username: ${PULSE_DB_USER:pulse_user}
    password: ${PULSE_DB_PASSWORD:pulse_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PulseHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PULSE_KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/pulse-engage}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    git:
      enabled: false

pulse:
  cors:
    allowed-origins: ${PULSE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5060}

logging:
  level:
    root: INFO
    com.pulseengage.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# =====================================================================
# Production profile — overrides only the unsafe defaults.
# Activate with: SPRING_PROFILES_ACTIVE=prod
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.pulseengage.backend: INFO
    org.hibernate.SQL: WARN
